[project]
name = "darkstore"
version = "0.1.0"
description = "Capacitated facility location for quick-commerce dark-store networks"
requires-python = ">=3.10"
dependencies = ["pulp>=2.7,<3", "numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
